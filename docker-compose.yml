services:
  mysql:
    image: mysql:8.4
    container_name: jadeguard-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jadeguard}
      MYSQL_USER: ${MYSQL_USER:-jadeguard}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-jadeguard}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-jadeguard_root}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - jadeguard-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  jadeguard-mysql-data:
