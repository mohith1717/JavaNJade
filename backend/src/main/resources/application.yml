spring:
  application:
    name: jadeguard-backend
  datasource:
    url: ${JADEGUARD_DB_URL:jdbc:mysql://127.0.0.1:3307/jadeguard?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${JADEGUARD_DB_USER:jadeguard}
    password: ${JADEGUARD_DB_PASSWORD:jadeguard}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${BACKEND_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jadeguard:
  security:
    jwt-secret: ${JADEGUARD_JWT_SECRET:jadeguard-development-secret-change-me-2026}
    jwt-expiration-seconds: ${JADEGUARD_JWT_EXPIRATION_SECONDS:3600}
