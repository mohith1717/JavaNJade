<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#47776d"/></marker><style>.t{font-family:Arial,sans-serif;fill:#173b35}.h{font-size:30px;font-weight:700}.s{font-size:17px;font-weight:700}.b{font-size:14px}.box{fill:#fff;stroke:#4f8579;stroke-width:2}.bad{fill:#fff3f1;stroke:#c96d60;stroke-width:2}.good{fill:#eff8f5;stroke:#4f8579;stroke-width:2}.line{stroke:#47776d;stroke-width:3;fill:none;marker-end:url(#a)}.red{stroke:#c96d60}</style></defs><rect width="1500" height="760" fill="#f7fbfa"/><text x="750" y="55" text-anchor="middle" class="t h">Transaction Processing and Risk Flow</text>
<rect x="45" y="250" width="170" height="90" rx="14" class="box"/><text x="130" y="282" text-anchor="middle" class="t s">Python Generator</text><text x="130" y="307" text-anchor="middle" class="t b">Normal, risky, invalid</text><text x="130" y="328" text-anchor="middle" class="t b">POST /transactions</text>
<rect x="270" y="250" width="165" height="90" rx="14" class="box"/><text x="352" y="282" text-anchor="middle" class="t s">Ingestion</text><text x="352" y="307" text-anchor="middle" class="t b">Store transaction</text><text x="352" y="328" text-anchor="middle" class="t b">RECEIVED</text>
<rect x="490" y="250" width="175" height="90" rx="14" class="box"/><text x="577" y="282" text-anchor="middle" class="t s">Validation</text><text x="577" y="307" text-anchor="middle" class="t b">Fields, currency, route</text><text x="577" y="328" text-anchor="middle" class="t b">VALIDATING</text>
<rect x="725" y="250" width="170" height="90" rx="14" class="good"/><text x="810" y="282" text-anchor="middle" class="t s">Validated</text><text x="810" y="307" text-anchor="middle" class="t b">Route persisted</text><text x="810" y="328" text-anchor="middle" class="t b">VALIDATED</text>
<rect x="955" y="250" width="185" height="90" rx="14" class="box"/><text x="1047" y="282" text-anchor="middle" class="t s">Rule Engine</text><text x="1047" y="307" text-anchor="middle" class="t b">Evaluate enabled rules</text><text x="1047" y="328" text-anchor="middle" class="t b">ASSESSING_RISK</text>
<rect x="1200" y="250" width="190" height="90" rx="14" class="good"/><text x="1295" y="282" text-anchor="middle" class="t s">Risk Assessment</text><text x="1295" y="307" text-anchor="middle" class="t b">Score + explanation</text><text x="1295" y="328" text-anchor="middle" class="t b">ASSESSED</text>
<path d="M215 295H270M435 295H490M665 295H725M895 295H955M1140 295H1200" class="line"/>
<rect x="490" y="500" width="220" height="105" rx="14" class="bad"/><text x="600" y="533" text-anchor="middle" class="t s">Validation Failed</text><text x="600" y="558" text-anchor="middle" class="t b">Store error codes + reasons</text><text x="600" y="582" text-anchor="middle" class="t b">No risk assessment</text><text x="600" y="603" text-anchor="middle" class="t b">VALIDATION_FAILED</text><path d="M577 340V500" class="line red"/>
<rect x="1130" y="500" width="330" height="105" rx="14" class="box"/><text x="1295" y="532" text-anchor="middle" class="t s">Alert Decision</text><text x="1295" y="558" text-anchor="middle" class="t b">LOW → none • MEDIUM → optional review</text><text x="1295" y="582" text-anchor="middle" class="t b">HIGH → alert • CRITICAL → urgent alert</text><path d="M1295 340V500" class="line"/>
<rect x="910" y="90" width="275" height="95" rx="14" class="box"/><text x="1047" y="122" text-anchor="middle" class="t s">Examples of Rule Contributions</text><text x="1047" y="148" text-anchor="middle" class="t b">Amount +35 • Country +40 • Hops +15</text><text x="1047" y="170" text-anchor="middle" class="t b">Watchlisted account +50</text><path d="M1047 185V250" class="line"/>
<text x="750" y="690" text-anchor="middle" class="t b">Every stage is stored, explainable, and available through readable REST endpoints.</text></svg>
